[project]
name = "cliphound"
version = "0.1.0"
description = "Long streams in, Shorts out. An open-source, local-first alternative to OpusClip"
authors = [
    { name = "Aswin Kumar", email = "ash20pk@gmail.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.34",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.10.26",
]


[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
